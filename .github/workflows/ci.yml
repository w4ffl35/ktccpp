name: ktccpp

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # This repository is private and uses the workstation runner queue.
    runs-on: [self-hosted, Linux, X64, ktccpp-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Check shell entry point
        run: bash -n build.sh
      - name: Configure Debug build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build executable
        run: cmake --build build --parallel
