name: ktccpp

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # This repository is public and uses GitHub-hosted Actions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell entry point
        run: bash -n build.sh
      - name: Configure Debug build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build executable
        run: cmake --build build --parallel
